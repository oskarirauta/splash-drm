name: "CI build"
run-name: ${{ github.actor }} executed build ${{ inputs.testname }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      testname:
        default: "manually"
        description: "build title"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # No libdrm-dev: the build uses the vendored drm/ headers and links no
    # libdrm at runtime, so installing the system package would only mask a
    # broken self-contained header path.
    - name: submodules
      # No --remote: build the pinned submodule commits we actually ship,
      # not each dependency's upstream HEAD.
      run: git submodule update --init --recursive
    - name: make (dynamic)
      run: make
    - name: make static (glibc)
      run: make clean && make static
    - name: make static (musl/Alpine, the initramfs target)
      # The headline use case is a dependency-free static musl binary. Build it
      # in an Alpine container and fail if it ended up with any shared-lib deps.
      run: |
        docker run --rm -v "$PWD":/src -w /src alpine:latest sh -c '
          apk add --no-cache build-base >/dev/null &&
          make clean &&
          make static &&
          if ldd splash-drm 2>&1 | grep -q "=>"; then
            echo "ERROR: splash-drm has shared-library dependencies:"; ldd splash-drm; exit 1;
          fi &&
          echo "musl static build is dependency-free: OK"
        '
