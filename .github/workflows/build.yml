name: "C++ CI build"
run-name: ${{ github.actor }} executed build ${{ inputs.testname }}

on:
  workflow_dispatch:
    inputs:
      testname:
        default: "manually"
        description: "build title"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: install libdrm
      run: |
        # Refresh the apt index first: the runner image ships a stale package
        # cache, so installing straight away fails with 404s on the .deb.
        sudo apt-get update
        sudo apt-get install -y libdrm-dev
    - name: submodules
      run: git submodule update --init --recursive --remote
    - name: make
      run: make
